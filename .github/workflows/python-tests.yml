name: Python unit tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  windows-python312:
    name: Windows / Python 3.12 / unittest
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          architecture: 'x64'

      - name: Verify Python version
        run: python --version

      - name: Run unit tests (mocked Defender)
        run: python -m unittest -v test_guard.py test_automatic.py test_apk_inspection.py

      - name: Detection benchmark baseline (non-blocking)
        shell: bash
        run: |
          python bench.py --json > bench-result.json || true
          python -c "import json; d=json.load(open('bench-result.json')); print('detection', d['detection_rate_pct'], '% | false positives', d['false_positive_rate_pct'], '%')"

      - name: Upload benchmark result
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: detection-benchmark
          path: bench-result.json
